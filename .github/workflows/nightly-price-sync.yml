name: Nightly Market & News Sync

on:
  schedule:
    # Runs Monday through Friday at 22:00 UTC (5:00 PM EST / 6:00 PM EDT)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    paths:
      - ".github/workflows/nightly-price-sync.yml"
      - "scripts/sync_news.ts"
      - "scripts/sync_prices.ts"
      - "src/lib/services/**"

jobs:
  sync-market-and-news:
    name: Sync Closing Prices & News Intelligence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit Repository Secrets
        run: |
          echo "::notice title=Secret Audit::DATABASE_URL len=${#DATABASE_URL}, MASSIVE_API_KEY len=${#MASSIVE_API_KEY}, POLYGON_API_KEY len=${#POLYGON_API_KEY}, FINNHUB_API_KEY len=${#FINNHUB_API_KEY}, MASSIVE_KEY len=${#MASSIVE_KEY}, POLYGON_KEY len=${#POLYGON_KEY}, FINNHUB_KEY len=${#FINNHUB_KEY}, MASSIVE_TOKEN len=${#MASSIVE_TOKEN}, POLYGON_TOKEN len=${#POLYGON_TOKEN}, FINNHUB_TOKEN len=${#FINNHUB_TOKEN}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          MASSIVE_TOKEN: ${{ secrets.MASSIVE_TOKEN }}
          POLYGON_TOKEN: ${{ secrets.POLYGON_TOKEN }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}

      - name: Run Price Sync Script
        run: npx tsx scripts/sync_prices.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          MASSIVE_TOKEN: ${{ secrets.MASSIVE_TOKEN }}
          POLYGON_TOKEN: ${{ secrets.POLYGON_TOKEN }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}

      - name: Run Global News Firehose Sync Script
        run: npx tsx scripts/sync_news.ts --firehose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          MASSIVE_TOKEN: ${{ secrets.MASSIVE_TOKEN }}
          POLYGON_TOKEN: ${{ secrets.POLYGON_TOKEN }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
