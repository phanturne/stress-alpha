name: Nightly Market Price Sync

on:
  schedule:
    # Runs Monday through Friday at 22:00 UTC (5:00 PM EST / 6:00 PM EDT)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    paths:
      - ".github/workflows/nightly-price-sync.yml"
      - "scripts/sync_prices.ts"
      - "src/lib/services/**"

jobs:
  sync-market-prices:
    name: Sync Closing Prices via Yahoo Finance
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Price Sync Script
        run: npx tsx scripts/sync_prices.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL || 'https://stressalpha.vercel.app' }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET || secrets.CRON_SECRET }}
