name: Automated Earnings Sync & Scaffolding

on:
  schedule:
    # 8:45 AM EST (12:45 UTC or 13:45 UTC depending on DST) - Post-BMO earnings
    - cron: "45 12 * * 1-5"
    # 5:15 PM EST (21:15 UTC or 22:15 UTC depending on DST) - Post-AMC earnings
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Specific date to sync (YYYY-MM-DD, defaults to today)"
        required: false
        type: string
      force_resync:
        description: "Force overwrite existing reports"
        required: false
        type: boolean
        default: false
      session:
        description: "Earnings reporting session filter (bmo | amc | all)"
        required: false
        type: choice
        options:
          - all
          - bmo
          - amc
        default: all
      ticker:
        description: "Target single ticker (e.g. RJF, NVDA). If omitted, processes calendar universe."
        required: false
        type: string
  push:
    paths:
      - ".github/workflows/earnings_sync.yml"
      - "scripts/sync_earnings_calendar.ts"

jobs:
  sync-earnings:
    name: Sync Earnings Calendar & Scaffold Reports
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Earnings Calendar Ingestion Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          MASSIVE_TOKEN: ${{ secrets.MASSIVE_TOKEN }}
          POLYGON_TOKEN: ${{ secrets.POLYGON_TOKEN }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date }}
          INPUT_FORCE_RESYNC: ${{ github.event.inputs.force_resync }}
          INPUT_SESSION: ${{ github.event.inputs.session }}
          INPUT_TICKER: ${{ github.event.inputs.ticker }}
        run: |
          ARGS=()
          if [ -n "$INPUT_TARGET_DATE" ]; then
            ARGS+=("--date=$INPUT_TARGET_DATE")
          fi
          if [ "$INPUT_FORCE_RESYNC" = "true" ]; then
            ARGS+=("--force")
          fi
          if [ "$INPUT_SESSION" = "bmo" ] || [ "$INPUT_SESSION" = "amc" ]; then
            ARGS+=("--session=$INPUT_SESSION")
          fi
          if [ -n "$INPUT_TICKER" ]; then
            ARGS+=("--ticker=$INPUT_TICKER")
          fi
          npx tsx scripts/sync_earnings_calendar.ts "${ARGS[@]}"
